name: kasir_rumah_makan
description: Aplikasi kasir (POS) rumah makan - offline, printer thermal bluetooth.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path: any
  provider: ^6.1.2
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  crypto: ^3.0.5
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
