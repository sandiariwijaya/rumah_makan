name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lengkapi folder platform Android
        run: flutter create --org com.sandi --project-name kasir_rumah_makan --platforms android .

      - name: Ambil paket
        run: flutter pub get

      - name: Analisa kode
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tes
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kasir-rumah-makan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
